<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EMRY - Eternal Memory</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }

    .container {
      padding: 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo {
      font-size: 32px;
      margin-bottom: 5px;
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .tagline {
      font-size: 12px;
      opacity: 0.9;
    }

    .status-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    .status-dot.connected {
      background: #00ff88;
      box-shadow: 0 0 10px #00ff88;
    }

    .status-dot.disconnected {
      background: #ff4444;
      box-shadow: 0 0 10px #ff4444;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    .status-text {
      font-size: 14px;
      font-weight: 600;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .stat-item {
      background: rgba(255, 255, 255, 0.1);
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      display: block;
    }

    .stat-label {
      font-size: 11px;
      opacity: 0.8;
      margin-top: 2px;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    button {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.3);
      transform: translateY(-1px);
    }

    button:active {
      transform: translateY(0);
    }

    .platforms {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 10px;
      font-size: 11px;
    }

    .platforms-title {
      font-weight: 600;
      margin-bottom: 8px;
      opacity: 0.9;
    }

    .platform-list {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .platform-tag {
      background: rgba(255, 255, 255, 0.2);
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 10px;
    }

    .footer {
      text-align: center;
      font-size: 10px;
      opacity: 0.7;
      margin-top: 15px;
    }

    .loading {
      text-align: center;
      padding: 20px;
    }

    .spinner {
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid #fff;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="logo">🧠</div>
      <h1>EMRY</h1>
      <div class="tagline">Eternal Memory</div>
    </div>

    <div id="loading" class="loading">
      <div class="spinner"></div>
      <p style="margin-top: 10px;">Checking status...</p>
    </div>

    <div id="content" style="display: none;">
      <div class="status-card">
        <div class="status-indicator">
          <div class="status-dot" id="statusDot"></div>
          <div class="status-text" id="statusText">Checking...</div>
        </div>

        <div class="stats">
          <div class="stat-item">
            <span class="stat-value" id="sessionMessages">0</span>
            <span class="stat-label">This Session</span>
          </div>
          <div class="stat-item">
            <span class="stat-value" id="totalMessages">0</span>
            <span class="stat-label">Total</span>
          </div>
        </div>
      </div>

      <div class="actions">
        <button id="openMemories">📂 Memories</button>
        <button id="refreshStatus">🔄 Refresh</button>
      </div>

      <div class="platforms">
        <div class="platforms-title">Supported Platforms</div>
        <div class="platform-list">
          <span class="platform-tag">ChatGPT</span>
          <span class="platform-tag">Claude</span>
          <span class="platform-tag">Gemini</span>
          <span class="platform-tag">Perplexity</span>
        </div>
      </div>

      <div class="footer">
        v2.0.0 • Made with ❤️
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
